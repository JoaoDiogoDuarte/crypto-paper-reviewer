name: CI

# Fast gate for every PR and every push to main. The deep campaign lives in
# torture.yml and runs weekly or on demand.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run it supersedes; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Globs, so new test files are syntax-checked without editing this list.
      - name: Syntax check
        run: |
          python -m compileall -q server.py convert.py tests
          for file in static/*.js tests/*.js; do node --check "$file"; done

      - name: Backend and conversion tests
        run: python -m unittest tests.backend_test tests.test_convert_contract tests.torture_conversion tests.test_convert_roundtrip

      - name: LaTeX round-trips (seeded fuzz + every fixture)
        run: |
          node tests/torture.js --seeds=1,7,42,99 --cases=700
          node tests/roundtrip.js tests/fixtures
          node tests/tabular_test.js

      # One Chrome session for the review smoke tests and a short seeded save fuzz.
      - name: Browser smoke tests
        env:
          E2E_SEEDS: '17'
          E2E_OPS: '18'
        run: |
          node tests/e2e.js render diff "Paper dialog" "two columns" "History UI: delete" "game editor" "layout: table" "save torture:"
      - name: UI bug bounty (quick, one fixture)
        run: UI_QUICK=1 node tests/ui_torture.js tests/fixtures/ieee-conf
